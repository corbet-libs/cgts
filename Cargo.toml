[package]
name = "cgts"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Gatekeeping facade of cvld: runs gates and collects gate results per community"
license = "FSL-1.1-ALv2"
repository = "https://github.com/corbet-libs/cgts"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE.md"]

[dependencies]
crlt = { git = "https://github.com/corbet-foss/crlt", rev = "6b94dacd7fa04aa8847c62c6471a1fc5c0f6c9dc" }
crbk = { git = "https://github.com/corbet-foss/crbk", rev = "fe70dc61262a80dd7681da853acfdad290f3910c" }
clbs = { git = "https://github.com/corbet-foss/clbs", rev = "2eeefb351484aadf430cd12083e0f198cde6a5b2" }
cgrd = { git = "https://github.com/corbet-foss/cgrd", rev = "947969cd38166f75914aa09256a6d2523990e0e4", default-features = false }
cvch = { git = "https://github.com/corbet-foss/cvch", rev = "bf0a5dede0af0680e6c74720cbb51f1c10a812e9" }
cblc = { git = "https://github.com/corbet-libs/cblc", rev = "8906e19d0841c0930bffabd3d88fc3fc6524b5a3" }
cpsd = { git = "https://github.com/corbet-foss/cpsd", rev = "5b2d5d9970d4beae171d85e478d06ba0b29e1992" }
rand = "0.8"
ed25519-dalek = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
csgn = { git = "https://github.com/corbet-foss/csgn", rev = "d7203f310c3c129c3f67ef4ef3e34ccf0ae8c93b", default-features = false, features = ["volatile-signer"] }
data-encoding = "2.9"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.dev.package."*"]
opt-level = 3
