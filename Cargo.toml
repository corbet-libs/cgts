[package]
name = "cgts"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Gatekeeping facade of cvld: runs gates and collects gate results per community"
license = "FSL-1.1-ALv2"
repository = "https://github.com/corbet-libs/cgts"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE.md"]

[dependencies]
cpns = { git = "https://github.com/corbet-foss/cpns", rev = "d68a3f3a2df322c513d0e754e452ee02aab7a5b9" }
crlt = { git = "https://github.com/corbet-foss/crlt", rev = "80dc046d6ab53b3ea530c45bf3d7038c8b2c61b2" }
crbk = { git = "https://github.com/corbet-foss/crbk", rev = "954c17762df251c1354bd9303354d82b0a81e487" }
clbs = { git = "https://github.com/corbet-foss/clbs", rev = "873f2dd7388c6d5e025a27b4c55447c4b4892a2d" }
cgrd = { git = "https://github.com/corbet-foss/cgrd", rev = "ff83c2b3fe786feb9b8c5f459b828ea1db4e6449", default-features = false }
cvch = { git = "https://github.com/corbet-foss/cvch", rev = "37ee0cba6c8be767c8e8ecd286ec225a21b564e1" }
cblc = { git = "https://github.com/corbet-libs/cblc", rev = "6d66b8d353d2054a54c164c8e186137a42ade4ab" }
cpsd = { git = "https://github.com/corbet-foss/cpsd", rev = "0d314b97bce9aeaffb5424159e8255ce34acee1e" }
rand = "0.8"
ed25519-dalek = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
csgn = { git = "https://github.com/corbet-foss/csgn", rev = "3ea958b522a15fecf65630aae1f9944135105497", default-features = false, features = ["volatile-signer"] }
data-encoding = "2.9"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.dev.package."*"]
opt-level = 3
