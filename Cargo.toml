[package]
name = "cgts"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Gatekeeping facade of cvld: runs gates and collects gate results per community"
license = "FSL-1.1-ALv2"
repository = "https://github.com/corbet-libs/cgts"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE.md"]

[dependencies]
cpns = { git = "https://github.com/corbet-foss/cpns", branch = "main" }
crlt = { git = "https://github.com/corbet-foss/crlt", branch = "main" }
crbk = { git = "https://github.com/corbet-foss/crbk", branch = "main" }
clbs = { git = "https://github.com/corbet-foss/clbs", branch = "main" }
cgrd = { git = "https://github.com/corbet-foss/cgrd", branch = "main", default-features = false }
cvch = { git = "https://github.com/corbet-foss/cvch", branch = "main" }
cblc = { git = "https://github.com/corbet-libs/cblc", branch = "main" }
cpsd = { git = "https://github.com/corbet-foss/cpsd", branch = "main" }
rand = "0.10"
ed25519-dalek = "3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
csgn = { git = "https://github.com/corbet-foss/csgn", branch = "main", default-features = false, features = ["volatile-signer"] }
data-encoding = "2.9"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.dev.package."*"]
opt-level = 3
