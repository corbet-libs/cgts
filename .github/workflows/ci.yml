name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: rustc --version
      - run: cargo fmt --all --check
      - run: node --test .github/check-pins.test.mjs
      - run: cargo metadata --format-version 1 > dependency-metadata.json
      - run: node .github/check-pins.mjs dependency-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-lock
          path: Cargo.lock
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --no-fail-fast
      - run: cargo test --locked --release --no-fail-fast
      - name: Prove the development gate is absent from release builds
        run: |
          mkdir -p examples
          cp .ci/development_gate_probe.rs examples/development_gate_probe.rs
          cargo check --locked --example development_gate_probe
          if cargo check --locked --release --example development_gate_probe > release-probe.log 2>&1; then
            echo "The development gate must not compile in release builds"
            exit 1
          fi
          cat release-probe.log
          grep -F 'could not find `development` in `gates`' release-probe.log
      - name: Retain resolved dependency identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: ignore
